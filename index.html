
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptForge 提示词工坊</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="logo"><span class="logomark">P</span>PromptForge</div>
      <nav class="mode-switch">
        <button id="btn-paint" class="active"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg> 提示词</button>
        <button id="btn-parse-mode"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 炸开</button>
      </nav>
      <button id="btn-settings" class="icon-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </header>

    <!-- 提示词模式 -->
    <main id="paint-mode">
      <!-- 左侧面板：编辑 + 画布 + 预览 -->
      <section class="left-panel">
        <div class="input-row">
          <input type="text" id="input-field" placeholder="输入提示词，按两下空格键变成标签...">
          <button id="btn-add-to-canvas" class="btn-add-to-canvas">添加</button>
        </div>
        <div class="tool-row">
          <div class="empty-tag-drag" id="empty-tag-drag">+ 空标签</div>
        </div>
        <div class="canvas-body">
          <div id="tag-canvas" class="tag-canvas"></div>
          <!-- 工具栏：浮动在画布内右下角 -->
          <div class="canvas-footer">
            <button id="btn-translate" title="切换中英文"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></button>
            <button id="btn-copy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> 复制</button>
            <button id="btn-clear"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> 清空</button>
          </div>
        </div>
        <div id="prompt-preview" class="prompt-preview">等待生成...</div>
      </section>

      <!-- 分隔条 -->
      <div class="panel-divider" id="panel-divider"></div>

      <!-- 右侧面板：分类 + 词库 -->
      <section class="right-panel">
        <nav class="category-tabs-bar">
          <div id="category-tabs" class="category-tabs"></div>
          <div class="cat-bar-actions">
            <div id="btn-add-cat" class="tab tab-add hidden"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 新增</div>
            <button id="btn-edit-cats" class="btn-edit-cats" title="编辑分类"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
          </div>
        </nav>

        <section class="library-area">
          <div class="library-toolbar">
            <div class="search-wrap">
              <input type="text" id="search-input" placeholder="搜索所有分类...">
              <button id="btn-search-clear" class="btn-search-clear hidden"><svg width="15" height="15" viewBox="0 0 48 48" fill="none"><path d="M8 8L40 40" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 40L40 8" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
            <button id="btn-edit-lib" class="btn-edit-lib" title="编辑词库"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
            <button id="btn-add-tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 添加</button>
          </div>
          <div id="tag-grid" class="tag-grid"></div>
        </section>
      </section>
    </main>

    <!-- 炸开模式 -->
    <main id="parse-mode" class="hidden">
      <section class="parse-page">
        <div class="parse-left" data-title="图片反推">
          <div class="image-section">
            <div class="image-upload-area" id="image-upload-area">
              <div class="image-upload-hint">点击上传图片 或 拖拽图片到这里</div>
              <input type="file" id="image-input" accept="image/*" hidden>
              <img id="image-preview" class="image-preview hidden">
            </div>
            <div class="image-actions">
              <button id="btn-reverse"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4"/><path d="M8 16H6a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M8 16v2a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2"/><circle cx="8" cy="12" r=".5"/><circle cx="16" cy="12" r=".5"/></svg> 反推提示词</button>
              <button id="btn-copy-reverse"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> 复制结果</button>
            </div>
            <textarea id="reverse-result" class="prompt-result" placeholder="等待反推..."></textarea>
            <div class="reverse-add-actions" id="reverse-add-actions">
              <button id="btn-reverse-to-parse">加入拆解</button>
            </div>
          </div>
        </div>
        <div class="parse-right" data-title="文本解析">
          <!-- 📝 文本解析 -->
          <textarea id="parse-input" placeholder="粘贴整段提示词，自动拆解..."></textarea>
          <div class="parse-options">
            <label><input type="checkbox" id="opt-comma" checked> 逗号切分</label>
            <label><input type="checkbox" id="opt-space"> 空格切分</label>
            <button id="btn-ai-parse" class="btn-ai-parse"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4"/><path d="M8 16H6a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M8 16v2a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2"/></svg> AI 语义拆分</button>
          </div>
          <div class="ai-loading hidden" id="ai-loading"><span></span><span></span><span></span> AI 解析中...</div>
          <div id="parse-result" class="parse-result"><span class="prompt-placeholder">拆分后的标签将在这里显示...</span></div>
          <div class="parse-actions">
            <button id="btn-parse-all">全部加入画布</button>
            <button id="btn-parse-save">保存整段</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 弹窗 -->
  <div id="modal-tag" class="modal hidden"><div class="modal-content">
    <h3 id="tag-modal-title">添加提示词</h3>
    <input type="text" id="input-cn" placeholder="提示词内容（中文）">
    <input type="text" id="input-en" placeholder="英文翻译（可选）">
    <div class="modal-actions"><button class="btn-cancel">取消</button><button class="btn-confirm">确认</button></div>
  </div></div>

  <div id="modal-confirm" class="modal hidden"><div class="modal-content">
    <h3>确认删除</h3><p id="confirm-msg"></p>
    <div class="modal-actions"><button class="btn-cancel">取消</button><button class="btn-danger">确认删除</button></div>
  </div></div>

  <!-- 设置弹窗 -->
  <div id="modal-settings" class="modal hidden">
    <div class="modal-content modal-settings-wide">
      <div class="settings-layout">
        <!-- 左侧标签导航 -->
        <nav class="settings-tabs">
          <div class="settings-tab active" data-tab="api"><span class="icon-svg">🔑</span> API 配置</div>
          <div class="settings-tab" data-tab="data"><span class="icon-svg">📦</span> 数据管理</div>
          <div class="settings-tab" data-tab="about"><span class="icon-svg">ℹ️</span> 关于</div>
        </nav>

        <!-- 右侧内容区 -->
        <div class="settings-body">

          <!-- API 配置面板 -->
          <div class="settings-panel" data-panel="api">
            <div class="settings-panel-header">
              <h3>API 配置</h3>
              <button id="btn-add-api" class="btn-add-api"><span class="icon-svg">+</span> 添加 API</button>
            </div>
            <div id="api-list" class="api-list"></div>
          </div>

          <!-- 数据管理面板 -->
          <div class="settings-panel hidden" data-panel="data">
            <h3>数据管理</h3>
            <div class="settings-data-actions">
              <button id="btn-export"><span class="icon-svg">📤</span> 导出数据</button>
              <button id="btn-import"><span class="icon-svg">📥</span> 导入数据</button>
              <button id="btn-template"><span class="icon-svg">📋</span> 下载模版</button>
              <input type="file" id="import-file" accept=".json,.csv" hidden>
            </div>
            <div class="settings-danger-zone">
              <h4>危险操作</h4>
              <button id="btn-reset" class="btn-danger"><span class="icon-svg">🗑️</span> 重置默认数据</button>
            </div>
          </div>

          <!-- 关于面板 -->
          <div class="settings-panel hidden" data-panel="about">
            <h3>关于 PromptForge</h3>
            <div class="about-content">
              <div class="about-logo"><span class="logomark">P</span> PromptForge</div>
              <p class="about-desc">一个简洁高效的 AI 提示词管理工具，支持标签拖拽组合、AI 语义拆分、图片反推等功能。</p>
              <div class="about-links">
                <a href="https://github.com/GULIGZ/prompt-forge" target="_blank" rel="noopener">GitHub 仓库</a>
              </div>
            </div>
          </div>

        </div>
      </div>
      <!-- 底部关闭按钮 -->
      <div class="settings-footer">
        <button class="btn-cancel btn-close-settings">关闭</button>
      </div>
    </div>
  </div>

  <!-- API 编辑/添加弹窗 -->
  <div id="modal-api-edit" class="modal hidden">
    <div class="modal-content">
      <h3 id="edit-api-title">添加 API 配置</h3>
      <div class="api-edit-form">
        <label>配置名称</label>
        <input type="text" id="edit-api-name" placeholder="例如：我的 OpenAI">
        <label>服务商</label>
        <select id="edit-api-provider" class="setting-select">
          <option value="openai">OpenAI</option>
          <option value="xiaomi">小米 MiMo</option>
          <option value="deepseek">DeepSeek</option>
          <option value="moonshot">Moonshot (Kimi)</option>
          <option value="zhipu">智谱 AI</option>
          <option value="siliconflow">硅基流动</option>
          <option value="alibaba">阿里云百炼</option>
          <option value="anthropic">Anthropic</option>
          <option value="openrouter">OpenRouter</option>
          <option value="together">Together AI</option>
          <option value="groq">Groq</option>
          <option value="custom">自定义</option>
        </select>
        <label>API 密钥</label>
        <input type="password" id="edit-api-key" placeholder="sk-... 或 其他格式密钥">
        <label>模型</label>
        <select id="edit-api-model" class="setting-select"></select>
        <div id="edit-api-custommodels-wrap">
          <label>自定义模型（可选，用逗号或换行分隔）</label>
          <textarea id="edit-api-custommodels" rows="2" placeholder="例如：gpt-4o, gpt-4o-mini"></textarea>
        </div>
        <div id="edit-api-custom-wrap" class="hidden">
          <label>接口地址 (baseURL)</label>
          <input type="text" id="edit-api-baseurl" placeholder="https://api.example.com/v1">
        </div>
      </div>
      <div class="modal-actions">
        <button id="btn-cancel-api" class="btn-cancel">取消</button>
        <button id="btn-save-api" class="btn-confirm">保存</button>
      </div>
    </div>
  </div>

  <!-- 撤销通知 -->
  <div id="undo-toast" class="undo-toast hidden">
    <span id="undo-msg"></span>
    <button id="btn-undo">撤销</button>
  </div>

  <script src="./app.js"></script>
</body>
</html>
