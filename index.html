<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptForge 提示词工坊</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="logo">PromptForge</div>
      <nav class="mode-switch">
        <button id="btn-paint" class="active">🎨 提示词</button>
        <button id="btn-parse-mode">🧩 炸开</button>
      </nav>
      <button id="btn-settings" class="icon-btn">⚙️</button>
    </header>

    <!-- 提示词模式 -->
    <main id="paint-mode">
      <section class="canvas-area" id="canvas-area">
        <input type="text" id="input-field" placeholder="输入提示词，按两下空格键变成标签...">
        <div class="canvas-body">
          <div id="tag-canvas" class="tag-canvas"></div>
          <!-- 工具栏：浮动在画布内右下角 -->
          <div class="canvas-footer">
            <button id="btn-translate" title="切换中英文">中/英</button>
            <button id="btn-copy">📋 复制</button>
            <button id="btn-clear">🗑️ 清空</button>
          </div>
        </div>
        <!-- 调整大小手柄 -->
        <div class="resize-handle" id="resize-handle"></div>
      </section>

      <nav class="category-tabs-bar">
        <div id="category-tabs" class="category-tabs"></div>
        <div class="cat-bar-actions">
          <div id="btn-add-cat" class="tab tab-add hidden">+ 新增</div>
          <button id="btn-edit-cats" class="btn-edit-cats" title="编辑分类">✏️</button>
        </div>
      </nav>

      <section class="library-area">
        <div class="library-toolbar">
          <input type="text" id="search-input" placeholder="🔍 搜索当前分类...">
          <button id="btn-edit-lib" class="btn-edit-lib" title="编辑词库">✏️</button>
          <button id="btn-add-tag">+ 添加</button>
        </div>
        <div id="tag-grid" class="tag-grid"></div>
      </section>
    </main>

    <!-- 炸开模式 -->
    <main id="parse-mode" class="hidden">
      <section class="parse-page">
        <div class="parse-left" data-title="🖼️ 图片反推">
          <div class="image-section">
            <div class="image-upload-area" id="image-upload-area">
              <div class="image-upload-hint">点击上传图片 或 拖拽图片到这里</div>
              <input type="file" id="image-input" accept="image/*" hidden>
              <img id="image-preview" class="image-preview hidden">
            </div>
            <div class="image-actions">
              <button id="btn-reverse">🤖 反推提示词</button>
              <button id="btn-copy-reverse">📋 复制结果</button>
            </div>
            <textarea id="reverse-result" class="prompt-result" placeholder="等待反推..."></textarea>
            <div class="reverse-add-actions" id="reverse-add-actions">
              <button id="btn-reverse-to-parse">加入拆解</button>
            </div>
          </div>
        </div>
        <div class="parse-right" data-title="📝 文本解析">
          <!-- 📝 文本解析 -->
          <textarea id="parse-input" placeholder="粘贴整段提示词，自动拆解..."></textarea>
          <div class="parse-options">
            <label><input type="checkbox" id="opt-comma" checked> 逗号切分</label>
            <label><input type="checkbox" id="opt-space"> 空格切分</label>
            <button id="btn-ai-parse" class="btn-ai-parse">🤖 AI 语义拆分</button>
          </div>
          <div class="ai-loading hidden" id="ai-loading"><span></span><span></span><span></span> AI 解析中...</div>
          <div id="parse-result" class="parse-result"><span class="prompt-placeholder">拆分后的标签将在这里显示...</span></div>
          <div class="parse-actions">
            <button id="btn-parse-all">全部加入画布</button>
            <button id="btn-parse-save">保存整段</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 弹窗 -->
  <div id="modal-tag" class="modal hidden"><div class="modal-content">
    <h3 id="tag-modal-title">添加提示词</h3>
    <input type="text" id="input-cn" placeholder="提示词内容（中文）">
    <input type="text" id="input-en" placeholder="英文翻译（可选）">
    <div class="modal-actions"><button class="btn-cancel">取消</button><button class="btn-confirm">确认</button></div>
  </div></div>

  <div id="modal-confirm" class="modal hidden"><div class="modal-content">
    <h3>⚠️ 确认删除</h3><p id="confirm-msg"></p>
    <div class="modal-actions"><button class="btn-cancel">取消</button><button class="btn-danger">确认删除</button></div>
  </div></div>

  <div id="modal-settings" class="modal hidden"><div class="modal-content">
    <h3>⚙️ 设置</h3>
    <div class="setting-row"><button id="btn-export">📤 导出数据</button><button id="btn-import">📥 导入数据</button><button id="btn-template">📋 下载模版</button><input type="file" id="import-file" accept=".json,.csv" hidden></div>
    <div class="setting-row setting-api">
      <span class="setting-label">🔑 API</span>
      <input type="password" id="input-api-key" class="setting-input" placeholder="sk-...">
    </div>
    <div class="setting-row setting-api-meta">
      <select id="select-provider" class="setting-select">
        <option value="openai">OpenAI</option>
        <option value="xiaomi">小米 MiMo</option>
      </select>
      <select id="select-model" class="setting-select">
      </select>
      <span id="api-status" class="setting-status"></span>
    </div>
    <div class="setting-row"><button id="btn-reset" class="btn-danger">重置默认数据</button></div>
    <div class="modal-actions"><button class="btn-cancel">关闭</button></div>
  </div></div>

  <script src="./app.js"></script>
</body>
</html>
